name: example-flat
用途: 本文中の概念図・フロー図(汎用見本)
トーン: フラット・落ち着き・実務的
配色:
  ベース: "#FFFFFF"
  文字: "#1A1A1A"
  アクセント: "#2563EB"
タイポ: サンセリフ・日本語混在可。長文を入れない
形式: フラットイラスト(写実・3D・厚みのある影は使わない)
余白構図: 余白を広く・縦積みグリッド・整列を強く
サイズ: 本文図は縦長〜正方形(横長は避ける) / サムネは横長16:9(1280×670)
prompt断片: >
  クリーム色・黄色がかった配色を避ける。
  キャラ/マスコットを描く場合は画風(レトロ印刷・記号化ピクトグラム等)を必ず固定する。
  技術名は対応するアイコン(鍵・歯車・扉・ノード等)を添える。
  図中の文字は日本語・少数・大きく。
メモ: |
  汎用見本。新規プロジェクトはここからコピーし、配色・形式を自分の好みに育てる。
