name: example
一言: 汎用見本。新規プロジェクトはここからコピーし、自分の声に書き換える。
敬体: ですます基調(である調にしてもよい)
一人称: 私
温度・距離: 読者に近すぎず遠すぎず。自虐や余白で温度を出す。
掴みの癖: >
  「あるある」で想定読者を自己同定させる導入が好み(「こんなこと、ありませんか」+ 箇条書き)。
  決め台詞はテンプレ化しない。同じ言い回しの多用は AI っぽさを呼ぶ。
時制: >
  自分が踏んだ出来事は過去形。一般現在で書くと読者にも必ず起きると決めつけて見える。
  結果として今も続く状態は現在形でよい。記事全体で時制を一貫させる。
好む書き方: >
  見せて、宣言しない(「先に結論を見せます」のような段取りの前置きを書かず、いきなり中身に入る)。
  体験・口語・体言止めを混ぜて温度を戻す。整えすぎて筆者の声を消さない。
避ける言い回し:
  - 段取りの宣言(「先に結論を見せます」「ここでは〜を説明します」「本記事では〜していきます」)
  - 中身のない定型(「いかがでしたか」「〜していきましょう」「実は」「ぜひ」「〜することが大切です」)
  - 動詞の力み(「消える」「終わらせる」等の大げさな動詞)
  - 気取り・クサさ(「核」「真髄」「極意」「〜の世界」/ キメ顔の締め「もう戻れません」「人生が変わる」)
noteらしさ: >
  情報だけでなく「その人が書いた意味」を残す。筆者自身の体験・違和感・発見・迷いを入れ、
  ただの解説記事にしない。
判断の物差し: 声に出して読んで気恥ずかしくないか。気恥ずかしければ気取り。
画像審美:
  避ける画風: 何が AI っぽいと感じるか書く(例: ツヤ目・セル塗りソフト陰影の汎用アニメ顔)
  逃げ場: テンプレ顔に寄ったときの切り替え先(例: 顔なしピクトグラム/記号化シルエット、レトロ印刷、手描きスケッチ線)
  方向: 全体の指向(例: クール・洗練 / 温かい・手描き / レトロ)
編集観点:                  # editor の観点別レビューで参照。空(無色)でも editor は機構だけで動く
  タイトル:                # 嫌う定型・蛇足(例:「〜した話」「〜してみた」「(補足)」)
  冒頭:                    # 嫌う始め方(例: 無難な一般論)
  画像:                    # 図に関する好み(例: 1セクション1図を厳格に / 技術名にはアイコン必須)
  その他:                  # 自由メモ
メモ: |
  汎用見本。固定の禁止語リストにせず、物差しで都度判断する。
  実プロジェクトでは個人の声に書き換え、リビング文書として育てる。
